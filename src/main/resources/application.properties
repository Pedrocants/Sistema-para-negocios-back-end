spring.application.name=Chepps
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
auth0.audience=https://dev-5adqzcmcjw8ixxv4.us.auth0.com/api/v2/
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-5adqzcmcjw8ixxv4.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audience=${auth0.audience}

logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ===============================
# HIBERNATE - OCULTAR SQL
# ===============================

spring.jpa.show-sql=false

# Evita que Hibernate imprima SQL formateado
spring.jpa.properties.hibernate.format_sql=false

# Desactiva estadisticas internas
spring.jpa.properties.hibernate.generate_statistics=false

# ===============================
# TOMCAT LOG MINIMO
# ===============================

logging.level.org.apache.catalina=ERROR
logging.level.org.apache.coyote=ERROR
logging.level.org.apache.tomcat=ERROR
